name: release

# Patch-bump and publish only when the push actually changes the library.
# README / CI / test-only commits do not mint a version, because a published
# pom is immutable on both Clojars and the private registry.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      # Include the workflow itself, so a change to the release pipeline is
      # exercised by the push that makes it instead of lying dormant until the
      # next unrelated src commit. Without this a broken pipeline stays
      # invisible until someone happens to ship library code.
      - '.gitea/workflows/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installed from download.clojure.org rather than via
      # DeLaGuardo/setup-clojure. That action calls the GitHub API
      # unconditionally — pinning an explicit version does NOT avoid it — and
      # authenticates with GITHUB_TOKEN, which under GITEA Actions is a Gitea
      # token that github.com rejects with "Bad credentials". It then logs
      # ::error:: WITHOUT failing its own step, so the job proceeds with no
      # Clojure on PATH and dies later at the first `clojure` call with a bare
      # exit 127, pointing nowhere near the real cause.
      #
      # Verified against hive-shape on 2026-07-22: run #1 (cli: latest) and
      # run #2 (cli: 1.12.4.1618) both failed this way; run #3 with the direct
      # install published 0.2.18 successfully.
      #
      # `clojure --version` is the assertion — a failed install fails HERE.
      - name: Setup Clojure CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/clj-install.sh \
            https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x /tmp/clj-install.sh
          sudo /tmp/clj-install.sh
          clojure --version

      # Gate BEFORE the bump: a published pom is immutable, so a red suite
      # must not be able to mint a version, tag it and ship it.
      - name: Test
        run: |
          if [ -d test ]; then
            clojure -M:test
          else
            echo "no test/ directory — nothing to gate on"
          fi

      - name: Bump patch version
        run: clojure -T:build bump :level :patch

      - name: Commit and tag
        run: |
          VER=$(cat VERSION)
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          git add VERSION
          # [skip ci] stops this push from retriggering the workflow.
          git commit -m "chore(release): $VER [skip ci]"
          # Annotated: `git push --follow-tags` ignores lightweight tags,
          # which would publish the artifact and silently drop the tag.
          git tag -a "v$VER" -m "release $VER"
          git push --follow-tags

      - name: Deploy
        env:
          MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
        run: clojure -T:build deploy
