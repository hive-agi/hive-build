name: release

# PINNED release: ./VERSION is tracked, so `bump` mints the next patch and the
# run commits + tags it.
#
# Path-filtered to library sources so CI / README / test-only commits don't mint
# an immutable pom.
#
# Secrets: MAVEN_USERNAME, MAVEN_TOKEN, MAVEN_URL — ORG-WIDE on hive-agi. NOT
# GITEA_-prefixed (Gitea reserves that prefix).

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      # Include the workflow itself so a change to the release pipeline is
      # exercised by the very push that makes it, instead of lying dormant
      # until the next unrelated src commit.
      - '.gitea/workflows/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pinned mode pushes the VERSION bump + tag
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
      MAVEN_URL: ${{ secrets.MAVEN_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # REQUIRED. The Gitea runner image ships no JDK, and the Clojure CLI
      # installs happily without one — so omitting this fails later at the
      # first `clojure` call with "Couldn't find 'java'. Please set JAVA_HOME",
      # pointing nowhere near the cause. Observed on hive-logic run #1.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # NOT DeLaGuardo/setup-clojure: that action calls the GitHub API
      # unconditionally and authenticates with GITHUB_TOKEN, which under Gitea
      # Actions is a *Gitea* token that github.com rejects. It logs ::error::
      # without failing its own step, so the job continues with no Clojure on
      # PATH and dies later with a bare exit 127, far from the cause.
      #
      # The official installer touches no API, so it behaves identically on
      # Gitea and GitHub. `clojure --version` is the assertion.
      - name: Setup Clojure CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/clj-install.sh \
            https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x /tmp/clj-install.sh
          sudo /tmp/clj-install.sh
          clojure --version

      # Give the resolver the private repo + credentials before any clojure cmd.
      - name: Materialize private-registry resolution credentials
        if: env.MAVEN_TOKEN != ''
        run: |
          # Mirror the clojure launcher's own resolution: $CLJ_CONFIG, else
          # $XDG_CONFIG_HOME/clojure when set, else $HOME/.clojure.
          CLJ_CONFIG="${CLJ_CONFIG:-${XDG_CONFIG_HOME:+$XDG_CONFIG_HOME/clojure}}"
          CLJ_CONFIG="${CLJ_CONFIG:-$HOME/.clojure}"
          mkdir -p "$CLJ_CONFIG" "$HOME/.m2"
          cat > "$CLJ_CONFIG/deps.edn" <<'EOF'
          {:mvn/repos {"hive-gitea" {:url "https://gitea.hive-mcp.com/api/packages/hive-agi/maven"}}}
          EOF
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>hive-gitea</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      # Gate BEFORE the bump: a published pom is immutable, so a red suite must
      # not be able to mint a version, tag it and ship it.
      - name: Test
        run: |
          if [ -d test ]; then
            clojure -M:test
          else
            echo "no test/ directory — nothing to gate on"
          fi

      - name: Bump patch version
        run: clojure -T:build bump :level :patch

      - name: Commit and tag
        run: |
          set -euo pipefail
          VER=$(cat VERSION)
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          git add VERSION
          git commit -m "chore(release): ${VER} [skip ci]"
          # Annotated: `git push --follow-tags` ignores lightweight tags, which
          # would publish the artifact and silently drop the tag.
          git tag -a "v${VER}" -m "Release ${VER}"
          git push --follow-tags

      # `deploy` reads version.edn :publish (:gitea). Idempotent — a re-run at a
      # version already in the registry HEAD-checks and skips.
      - name: Deploy
        if: env.MAVEN_TOKEN != ''
        run: clojure -T:build deploy
