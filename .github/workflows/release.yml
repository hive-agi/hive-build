name: release

# Patch-bump and publish only when the push actually changes the library.
# README / CI / test-only commits do not mint a version, because a published
# pom is immutable on both Clojars and the private registry.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      # The suite gates the bump/deploy below, so a test-only change MUST be
      # able to trigger a run: excluded here, a test fix can never be validated
      # and a test-only regression stays invisible until an unrelated src push
      # trips over it.
      - 'test/**'
      - 'tests.edn'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # NOT DeLaGuardo/setup-clojure: it calls the GitHub API with
      # GITHUB_TOKEN, which under Gitea Actions is a Gitea token github.com
      # rejects, leaving no clojure on PATH (exit 127 in a later step).
      # The official installer touches no API and runs the same on both.
      - name: Setup Clojure CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/clj-install.sh \
            https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x /tmp/clj-install.sh
          sudo /tmp/clj-install.sh
          clojure --version

      # Licence gate. LICENSE, version.edn :license and the src SPDX headers
      # must agree, and a published pom can never be retracted, so drift has to
      # stop the run rather than scroll past as a warning. `:strict true` throws
      # on hive-build >= the release that added it; the grep keeps an older
      # pinned hive-build (which ignores :strict and only warns) failing too.
      - name: Verify licence
        run: |
          set -euo pipefail
          out=$(clojure -T:build verify-license :strict true 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q 'WARNING: license inconsistency'; then
            echo "::error::licence drift: LICENSE, version.edn and SPDX headers disagree"
            exit 1
          fi

      # Gate BEFORE the bump: a published pom is immutable, so a red suite
      # must not be able to mint a version, tag it and ship it.
      - name: Test
        run: |
          if [ -d test ]; then
            clojure -M:test
          else
            echo "no test/ directory — nothing to gate on"
          fi

      - name: Bump patch version
        run: clojure -T:build bump :level :patch

      # Runs AFTER the bump and BEFORE the tag: the pending version comes from
      # ./VERSION, which no tag names yet, so the release describes itself.
      # The :build alias runs the PUBLISHED hive-build, so a task that first
      # ships in the release being cut does not exist yet on this runner. A
      # missing task skips (the next release, pinned past this one, regenerates
      # the file); any other failure still stops the release.
      - name: Regenerate changelog
        run: |
          set +e
          out=$(clojure -T:build changelog 2>&1)
          status=$?
          set -e
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            case "$out" in
              *"function not found: changelog"*)
                echo "skip: the pinned hive-build predates the changelog task" ;;
              *) exit "$status" ;;
            esac
          fi

      - name: Commit and tag
        run: |
          VER=$(cat VERSION)
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          git add VERSION CHANGELOG.md
          # [skip ci] stops this push from retriggering the workflow.
          git commit -m "chore(release): $VER [skip ci]"
          # Annotated: `git push --follow-tags` ignores lightweight tags,
          # which would publish the artifact and silently drop the tag.
          git tag -a "v$VER" -m "release $VER"
          git push --follow-tags

      - name: Deploy
        env:
          # The hive-agi org secret is CLOJARS_DEPLOY_TOKEN, while deps-deploy
          # and build.clj both read CLOJARS_PASSWORD. Map one onto the other.
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy
